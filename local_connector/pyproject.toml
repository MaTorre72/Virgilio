[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virgilio-local-connector"
version = "0.11.0"
description = "Connettore IMAP read-only con presa in carico staging di test"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Virgilio project contributors" }
]
dependencies = ["google-auth>=2.30,<3", "google-auth-oauthlib>=1.2,<2", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
virgilio = "virgilio_connector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
