accounts:
  - account_alias: marco_sigmapiu
    email: marco@example.invalid
    provider_hint: gmail_workspace
    imap_host: imap.gmail.com
    imap_port: 993
    username_env: VIRGILIO_IMAP_MARCO_SIGMAPIU_USERNAME
    password_env: VIRGILIO_IMAP_MARCO_SIGMAPIU_PASSWORD
    input_folder: Virgilio/da-traghettare
    done_folder: Virgilio/traghettate
    error_folder: Virgilio/errore
    enabled: true
    max_messages: 25
    ack_enabled: false
    ack_strategy: add_done_label_only

storage:
  adapter: local_filesystem
  staging_dir: C:\Percorso\Virgilio_Staging
  use_account_subfolders: true
  copy_manifest: true
  overwrite: false
  create_staging_dir: false

rules:
  default_action: include
  include:
    - name: pdf_invoices
      subject_contains: ["fattura", "invoice", "acconto"]
      filename_extensions: [".pdf", ".p7m"]
  exclude:
    - name: newsletters
      from_contains: ["newsletter", "noreply"]
    - name: small_signatures
      max_attachment_size_bytes: 10239
